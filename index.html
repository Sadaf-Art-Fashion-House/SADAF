<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>SADAF | Art & Fashion House — Cairo & Alexandria Heritage</title>
  <meta name="description"
    content="SADAF is an immersive digital art and fashion empire blending centuries of Cairo and Alexandrian heritage with AI design technologies. Discover exclusive collections, fine art, and custom fashion." />
  <meta name="keywords"
    content="SADAF, Arabic fashion, Egyptian art, luxury fashion, AI fashion design, Cairo art, Alexandria fashion, fine art, custom clothing" />
  <meta name="author" content="SADAF Art & Fashion House" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph (Facebook, WhatsApp) -->
  <meta property="og:title" content="SADAF | Art & Fashion House" />
  <meta property="og:description"
    content="An immersive digital empire blending centuries of Cairo and Alexandrian fine heritage with state-of-the-art AI design technologies." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sadaf-nu.vercel.app" />
  <meta property="og:image" content="https://sadaf-nu.vercel.app/og-image.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SADAF | Art & Fashion House" />
  <meta name="twitter:description" content="Discover exclusive Arabic art and fashion collections powered by AI." />
  <meta name="twitter:image" content="https://sadaf-nu.vercel.app/og-image.jpg" />

  <!-- Canonical -->
  <link rel="canonical" href="https://sadaf-nu.vercel.app" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
